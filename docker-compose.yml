services:
  medusa-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medusa-store
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  medusa:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@medusa-postgres:5432/medusa-store
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_prod}
      COOKIE_SECRET: ${COOKIE_SECRET:-dev_cookie_secret_change_in_prod}
      STORE_CORS: ${STOREFRONT_URL:-http://localhost:8000},http://localhost:8000
      ADMIN_CORS: http://localhost:5173,http://localhost:9000
      AUTH_CORS: ${STOREFRONT_URL:-http://localhost:8000},http://localhost:5173,http://localhost:9000
      NODE_ENV: development
      # Phase 2 — CDEK delivery points
      CDEK_CLIENT_ID: ${CDEK_CLIENT_ID:-}
      CDEK_CLIENT_SECRET: ${CDEK_CLIENT_SECRET:-}
      # Phase 3 — YooKassa (uncomment after setup)
      # YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      # YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      # YOOKASSA_RETURN_URL: ${YOOKASSA_RETURN_URL:-http://localhost:8000/shop/order?pay=yookassa}
    depends_on:
      medusa-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # On first run Medusa will migrate DB automatically
    # After first start, run seed:
    #   docker compose exec medusa node -e "require('./src/scripts/seed.js')"

  storefront:
    build:
      context: ./storefront
      dockerfile: Dockerfile
    ports:
      - "8000:3000"
    environment:
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
      MEDUSA_BACKEND_URL: http://medusa:9000
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${MEDUSA_PUBLISHABLE_KEY:-pk_placeholder}
      MEDUSA_PUBLISHABLE_KEY: ${MEDUSA_PUBLISHABLE_KEY:-pk_placeholder}
    depends_on:
      - medusa
    profiles:
      - full

volumes:
  postgres-data:
