name: Deploy Storefront → GitHub Pages

on:
  push:
    branches: [mainb]
    paths:
      - "storefront/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:   # позволяет запустить вручную из вкладки Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: storefront/package-lock.json

      - name: Install dependencies
        working-directory: storefront
        run: npm ci

      - name: Build static export
        working-directory: storefront
        env:
          NEXT_PUBLIC_BASE_PATH: /brightic/shop
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: https://brightic-production.up.railway.app
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_878aa8a31afb55251df3c644d0f226934ae4ecd4f4a41f54219560622a09f96a
          MEDUSA_BACKEND_URL: https://brightic-production.up.railway.app
          MEDUSA_PUBLISHABLE_KEY: pk_878aa8a31afb55251df3c644d0f226934ae4ecd4f4a41f54219560622a09f96a
        run: npm run build:pages

      - name: Wrap output under /shop/ subfolder
        run: |
          mkdir -p storefront/pages_root/shop
          cp -r storefront/out/. storefront/pages_root/shop/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: storefront/pages_root

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
